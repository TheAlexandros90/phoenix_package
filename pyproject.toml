[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-df"
version = "0.1.0"
description = "Utilities for cleaning, profiling, and preparing pandas DataFrames"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "plotly>=5.0",
  "scikit-learn>=1.3",
  "scipy>=1.10"
]
keywords = ["pandas", "data-cleaning", "dataframe", "profiling"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Information Analysis"
]

[project.urls]
Homepage = "https://github.com/TheAlexandros90/phoenix_package"
Repository = "https://github.com/TheAlexandros90/phoenix_package"
Issues = "https://github.com/TheAlexandros90/phoenix_package/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
